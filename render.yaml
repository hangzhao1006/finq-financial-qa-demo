services:
  - type: web
    name: finq-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash backend/start_render.sh
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: FALLBACK_LLM_MODEL
        value: gpt-3.5-turbo
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: RERANK_PROVIDER
        value: none
      - key: CHROMA_PERSIST_DIR
        value: backend/.chroma
      - key: CACHE_BACKEND
        value: memory
